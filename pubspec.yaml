name: talky_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1                 # Police manuscrite pour la mise en forme des messages
  screen_protector: ^1.4.2             # Blocage des captures d'écran (médias à vue unique)
  socket_io_client: ^2.0.3+1
  http: ^1.6.0
  http_parser: ^4.0.2                  # MediaType pour les uploads multipart
  mime: ^2.0.0                         # Détection du type MIME des fichiers
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.0
  flutter_webrtc: ^0.14.2
  permission_handler: ^12.0.1
  just_audio: ^0.9.0                   # Ringback tone (appelant)
  flutter_ringtone_player: ^4.0.0+4   # Sonnerie système native (appelé)
  vibration: ^3.1.8                   # Vibration appel entrant
  audio_session: ^0.1.21              # Configurer le canal audio (call vs media)

  # Firebase + push notifications + écran d'appel système
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^3.1.5    # Telecom auto-géré Android (CallKit-like)
  flutter_local_notifications: ^17.2.3
  app_badge_plus: ^1.1.6
  wakelock_plus: ^1.2.8               # Garder l'écran allumé pendant l'appel

  # ── Chat : stockage local offline-first (drift / SQLite) ──────────
  drift: ^2.20.0                      # ORM SQLite typé, requêtes réactives
  sqlite3_flutter_libs: ^0.5.24       # Binaire SQLite embarqué (Android/iOS)
  path_provider: ^2.1.4               # Dossier documents app (DB + cache médias)
  path: ^1.9.0
  crypto: ^3.0.6

  # ── Chat : médias (images, vidéos, fichiers) ──────────────────────
  gal: ^2.3.1                         # Sauvegarde photos/vidéos vers album Alanya
  image_picker: ^1.1.2                # Galerie / caméra (photos & vidéos)
  camera: ^0.11.0+2                   # Écran caméra intégré (photo + vidéo)
  file_picker: ^8.1.2                 # Sélection de documents
  cached_network_image: ^3.4.1        # Affichage + cache disque des images
  # Déjà tiré par cached_network_image, mais déclaré : `map_tiles.dart` s'en sert
  # directement pour un cache de tuiles séparé de celui des avatars. Une
  # dépendance transitive peut disparaître à la faveur d'une mise à jour.
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.2                # Lecture vidéo inline
  chewie: ^1.8.5                      # Contrôles vidéo prêts à l'emploi
  record: ^5.1.2                      # Enregistrement messages vocaux
  audio_waveforms: ^2.0.2             # Waveform réelle des messages vocaux
  emoji_picker_flutter: ^3.1.0        # Sélecteur d'émojis
  open_filex: ^4.5.0                  # Ouvrir un fichier (PDF, doc…) avec l'app système
  url_launcher: ^6.3.0                 # Ouverture des liens cliquables dans le navigateur
  html: ^0.15.4                        # Parsing des métadonnées Open Graph (aperçu de liens)
  pdfx: ^2.6.0                         # Aperçu et visionneuse PDF intégrée
  geolocator: ^13.0.2                  # GPS pour partage de position
  flutter_map: ^7.0.2                  # Carte interactive (écran d'envoi)
  latlong2: ^0.9.1                     # Coordonnées lat/lng pour flutter_map

  # ── Connectivité (offline detection au niveau OS) ────────────────
  connectivity_plus: ^6.1.0

  # ── UI : swipe actions sur listes / bulles ───────────────────────
  flutter_slidable: ^3.0.0

  # ── QR : mon code d'identité et connexion d'un nouvel appareil ───
  qr_flutter: ^4.1.0                  # Rendu du QR à l'écran (Dart pur)
  mobile_scanner: ^7.4.0              # Scan du QR (CameraX + ML Kit / AVFoundation)

  # ── Identification appareil (marque + modèle pour userAccess) ────
  device_info_plus: ^10.1.2
  video_thumbnail: ^0.5.6

  # Splash natif : doit être en dependencies (pas dev_dependencies), sinon
  # GeneratedPluginRegistrant le référence en release sans module Android → build fail.
  flutter_native_splash: ^2.4.4
  share_plus: ^12.0.2
  # Épinglé en 1.8.1 : la 1.9.0 embarque un build.gradle ciblant AGP 9.2.1 /
  # Kotlin 2.4.0 (non stables) et casse avec le toolchain du projet
  # (AGP 8.9.1 / Kotlin 2.1.0 / Gradle 8.12) — « Could not find method kotlin() ».
  receive_sharing_intent: 1.8.1
  audio_metadata_reader: ^1.6.0
  app_links: ^7.2.1
  local_auth: ^2.3.0
  package_info_plus: ^8.1.2
  # Niveau de batterie pendant un trajet de confiance. Ce n'est pas de la
  # télémétrie : le serveur ralentit la cadence sous 15 % et le cercle est
  # informé, parce qu'un téléphone qui meurt est un signal — pas une
  # disparition.
  battery_plus: ^7.1.1
  # ── Traduction des messages, entièrement sur l'appareil ───────────
  # Aucun contenu de message ne quitte le téléphone, et la traduction
  # fonctionne hors ligne — cohérent avec le reste de l'architecture
  # offline-first (drift + outbox + sync delta).
  #
  # Ces deux paquets imposent `IPHONEOS_DEPLOYMENT_TARGET = 15.5` (leurs
  # podspecs le déclarent, et google_mlkit_commons avec eux). C'est ce qui a
  # fait passer le projet de 13.0 à 15.5. Aucun appareil n'est perdu au
  # passage : iOS 15 couvre le même parc qu'iOS 13 (iPhone 6s et ultérieurs).
  # Contrairement à ce qu'on pourrait croire, mobile_scanner ne portait PAS
  # déjà cette contrainte — il déclare 12.0 (son scan iOS passe par
  # AVFoundation, pas par ML Kit).
  google_mlkit_translation: ^0.14.0
  google_mlkit_language_id: ^0.14.0

# record_linux 0.7.2 (dernière du range <1.0.0 exigé par record) n'implémente
# pas record_platform_interface 1.5.0 → casse la compilation. On force la
# version Linux maintenue (l'app cible mobile, ceci débloque le build).
dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Génération de code drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/new_alanya_logo.png
  web:
    generate: true
    image_path: assets/images/new_alanya_logo.png
    background_color: "#FFFFFF"
    theme_color: "#3F51B5"
  windows:
    generate: true
    image_path: assets/images/new_alanya_logo.png
  macos:
    generate: true
    image_path: assets/images/new_alanya_logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/new_alanya_logo_splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/new_alanya_logo_splash.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sounds/
    - assets/sounds/ringtones/   # Sonneries d'APPEL fournies avec l'app (aperçu/foreground)
    - assets/sounds/notifications/ # Sons de NOTIFICATION de message (aperçu/foreground)
    - assets/sounds/ui/          # Sons d'interface (message, scan QR, fin d'appel)
    - assets/server_cert.pem   # Certificat backend épinglé (cert pinning)
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
