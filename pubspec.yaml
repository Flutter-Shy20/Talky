name: talky_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which versions are available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8                 # Cupertino Icons iOS
  google_fonts: ^6.2.1                    # Police manuscrite pour la mise en forme des messages
  screen_protector: ^1.4.2                # Blocage des captures d'écran (médias à vue unique)
  socket_io_client: ^2.0.3+1
  http: ^1.6.0
  http_parser: ^4.0.2                     # MediaType pour les uploads multipart
  mime: ^1.0.6                            # Détection du type MIME des fichiers
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.0
  flutter_webrtc: ^0.14.2
  permission_handler: ^12.0.1
  just_audio: ^0.9.0                      # Ringback tone (appelant)
  flutter_ringtone_player: ^4.0.0+4       # Sonnerie système native (appelé)
  vibration: ^3.1.8                       # Vibration appel entrant
  audio_session: ^0.1.21                  # Configurer le canal audio (call vs media)

  # Firebase + push notifications + écran d'appel système
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_callkit_incoming: ^2.5.0        # ConnectionService Android (CallKit-like)
  flutter_local_notifications: ^17.2.3
  wakelock_plus: ^1.2.8                   # Garder l'écran allumé pendant l'appel

  # ── Chat : stockage local offline-first (drift / SQLite) ──────────
  drift: ^2.20.0                          # ORM SQLite typé, requêtes réactives
  sqlite3_flutter_libs: ^0.5.24          # Binaire SQLite embarqué (Android/iOS)
  path_provider: ^2.1.4                  # Dossier documents app (DB + cache médias)
  path: ^1.9.0

  # ── Chat : médias (images, vidéos, fichiers) ──────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  record: ^5.1.2
  emoji_picker_flutter: ^3.1.0
  open_filex: ^4.5.0

  # ── Connectivité (offline detection au niveau OS) ────────────────
  connectivity_plus: ^6.1.0

  # ── Identification appareil (marque + modèle pour userAccess) ────
  device_info_plus: ^10.1.2

  # 🌍 Géolocalisation + ouverture de liens externes
  geolocator: ^13.0.1
  url_launcher: ^6.3.0

# record_linux 0.7.2 (dernière du range <1.0.0 exigé par record) n'implémente
# pas record_platform_interface 1.5.0 → casse la compilation. On force la
# version Linux maintenue (l'app cible mobile, ceci débloque le build).
dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/server_cert.pem   # Certificat backend épinglé (cert pinning)